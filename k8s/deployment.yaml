apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-food-backend-deployment
  labels:
    app: smart-food-backend
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-food-backend
  template:
    metadata:
      labels:
        app: smart-food-backend
    spec:
      containers:
        - name: backend
          image: smart-food-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: backend-data-storage
              mountPath: /app/data
      volumes:
        - name: backend-data-storage
          emptyDir: {}
