name: Smart Food Donation CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------------------------
  # JOB 1: Backend CI (Install, Test, and Docker Verification)
  # ----------------------------------------------------------------------
  backend-ci:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Backend Automated API Test Suite
        run: npm test

      - name: Verify Docker Backend Build
        working-directory: .
        run: |
          docker build -t smart-food-backend:latest -f docker/Dockerfile .

  # ----------------------------------------------------------------------
  # JOB 2: Mobile App CI (Lint, Typecheck & Expo Bundle Check)
  # ----------------------------------------------------------------------
  mobile-ci:
    name: Mobile App Lint & Expo Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install Mobile Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Mobile Lint Verification
        run: npm run lint

      # Optional Cloud Build Step with Expo Application Services (EAS):
      # To enable automated APK or iOS IPA builds, configure the secret:
      # EXPO_TOKEN in your GitHub Repository -> Settings -> Secrets and variables -> Actions
